name: smart_auto_car
description: SmartAutoCar — AI-powered automotive assistant.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  supabase_flutter: ^2.8.4
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  lottie: ^3.1.3
  image_picker: ^1.1.2
  record: ^6.2.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  google_generative_ai: ^0.4.6
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  http: ^1.2.2
  uuid: ^4.5.1
  speech_to_text: ^7.0.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  flutter_dotenv: ^5.2.1
  audioplayers: ^6.1.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo.png
  adaptive_icon_background: "#7289FF"
  adaptive_icon_foreground: assets/logo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/logo.png
    - .env

org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.daemon.jvm.options=-Xmx1G
android.useAndroidX=true
# Windows: parallel multi-project builds often race javac "clean output" vs "write .class" → Unable to delete directory.
org.gradle.parallel=false
# Use a single worker to avoid concurrent output-dir races on Windows.
org.gradle.workers.max=1
# Disable Gradle build cache to avoid stale/missing zip-cache artifacts on Windows.
org.gradle.caching=false
# Windows: native file watcher can race with Flutter asset steps; disabling avoids occasional missing intermediates.
org.gradle.vfs.watch=false
# Avoid separate Kotlin daemon on Windows (fixes "Could not connect to Kotlin compile daemon").
kotlin.compiler.execution.strategy=in-process
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
